version: 2.1

# `run-weekly-security` はCircleCI Scheduled Pipeline（Project Settings/API側で
# 週次cronトリガーを設定し、このパラメータをtrueで渡す）専用のスイッチ。
# 通常のpush/PR起点のパイプラインでは既定のfalseのまま。
parameters:
  run-weekly-security:
    type: boolean
    default: false

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.99.0

commands:
  cargo-with-lock:
    description: "Run a cargo subcommand with --locked (Cargo.lock is committed)"
    parameters:
      subcommand:
        type: string
    steps:
      - run:
          name: "cargo <<parameters.subcommand>> --locked"
          command: cargo <<parameters.subcommand>> --locked

jobs:
  # リリースは main へのマージ時に semantic-release がコミットメッセージから次バージョンを
  # 決める（README「リリース」参照）。そのため、main に入る前にブランチ上の各コミットが
  # Conventional Commits になっているかをここで検証する。
  commitlint:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    steps:
      - checkout
      - run:
          name: "Install commitlint (without lifecycle scripts)"
          command: |
            set -euo pipefail
            COMMITLINT_DIR="${HOME}/commitlint"
            npm install --prefix "$COMMITLINT_DIR" --ignore-scripts --no-audit --no-fund \
              @commitlint/cli@21.2.3 \
              @commitlint/config-conventional@21.2.3
            # extends は commitlint を実行するディレクトリから解決されるため、設定も
            # インストール先に置く。subject-case と行長のルールは英語向けで、日本語の
            # 件名（例: 「Rust を上げる」）や本文を誤って弾くので無効にする。型（feat / fix 等）と
            # 「型: 件名」の形式はそのまま検証する。
            cat > "${COMMITLINT_DIR}/commitlint.config.mjs" \<<'EOF'
            export default {
              extends: ['@commitlint/config-conventional'],
              rules: {
                'subject-case': [0],
                'body-max-line-length': [0],
                'footer-max-line-length': [0],
              },
            };
            EOF
      - run:
          name: "Lint commit messages on this branch"
          command: |
            set -euo pipefail
            git fetch origin main
            REPO_DIR="$PWD"
            COMMITS="$(git rev-list --no-merges origin/main..HEAD)"
            if [ -z "$COMMITS" ]; then
              echo "origin/main にないコミットはありません。"
              exit 0
            fi
            cd "${HOME}/commitlint"
            FAILED=0
            for sha in $COMMITS; do
              if ! git -C "$REPO_DIR" log -1 --format=%B "$sha" | ./node_modules/.bin/commitlint; then
                echo "上のコミット ${sha} のメッセージが Conventional Commits ではありません。" >&2
                FAILED=1
              fi
            done
            if [ "$FAILED" -ne 0 ]; then
              echo "例: 'feat: retention set に --dry-run を追加' / 'fix(cli): 非TTYで --execute を拒否する'。直し方は AGENTS.md の「コミットメッセージ」を参照。" >&2
              exit 1
            fi

  fmt:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: "cargo fmt --check"
          command: cargo fmt --check

  clippy:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: "cargo clippy -- -D warnings"
          command: cargo clippy --all-targets --locked -- -D warnings
      - save_cache:
          key: cargo-registry-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target

  test:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - cargo-with-lock:
          subcommand: build
      # 実AWSアカウントに接触するテストは #[ignore] で分離済み。通常CI実行では実行しない
      # （team.mdの合意事項: CIでは実 AWS アカウントに接触するテストを自動実行しない）。
      - cargo-with-lock:
          subcommand: test

  coverage:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: "Install cargo-llvm-cov"
          command: |
            if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
              cargo install cargo-llvm-cov --locked
            fi
      - run:
          name: "cargo llvm-cov (行カバレッジ80%floor)"
          command: |
            cargo llvm-cov --lib --locked --fail-under-lines 80 --summary-only

  audit:
    executor: rust-executor
    steps:
      - checkout
      - run:
          name: "Install cargo-audit"
          command: |
            if ! command -v cargo-audit >/dev/null 2>&1; then
              cargo install cargo-audit --locked
            fi
      - run:
          name: "cargo audit (NFR2.6, 既知脆弱性があればブロック)"
          command: cargo audit

  deny:
    executor: rust-executor
    # `advisories`はRustSec脆弱性DBを見るため`audit`と同じ理由（DB更新に伴う非決定性・
    # 通常CIをブロックしたくない）で既定から外す。週次ワークフローでのみ`advisories`も含めて実行する。
    parameters:
      checks:
        type: string
        default: "bans licenses sources"
    steps:
      - checkout
      - run:
          name: "Install cargo-deny"
          command: |
            if ! command -v cargo-deny >/dev/null 2>&1; then
              cargo install cargo-deny --locked
            fi
      - run:
          name: "cargo deny check <<parameters.checks>> (NFR2.7)"
          command: cargo deny check <<parameters.checks>>

workflows:
  build-and-test:
    unless: << pipeline.parameters.run-weekly-security >>
    jobs:
      - commitlint:
          filters:
            branches:
              ignore: main
      - fmt
      - clippy
      - test
      - coverage
      - deny

  # NFR2.6/2.7: 既知脆弱性チェック（cargo audit / cargo deny advisories）はRustSec DBの
  # 更新に依存し非決定的なため、通常のpush/PR CIをブロックせず週次で実行する。
  # トリガーはCircleCI Project Settings（またはAPI）のScheduled Pipelineで
  # `run-weekly-security: true` パラメータを渡して設定する（config.yml側の設定は不要）。
  weekly-security:
    when: << pipeline.parameters.run-weekly-security >>
    jobs:
      - audit
      - deny:
          name: deny-advisories
          checks: "advisories"

# リリース（main への push で、semantic-release が Conventional Commits から次バージョンを決め、
# クロスプラットフォームのリリースバイナリをビルドし、vX.Y.Z タグ付きの GitHub Release を作成して
# 添付する）は、このリポジトリのパイプライン定義には含まれていない。
# hideokamoto/circleci-configurations の workflows/release/rust-github-semantic-release.yaml を
# CircleCI の Config Sources 機能（複数パイプライン設定）で紐づけた、別のパイプライン定義
# （Pushes to default branch 起点）として実行する。タグはそのパイプラインが自動作成するため
# 手動で push しない。詳細は README.md の「リリース」節を参照。
