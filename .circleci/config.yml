version: 2.1

# `run-weekly-security` はCircleCI Scheduled Pipeline（Project Settings/API側で
# 週次cronトリガーを設定し、このパラメータをtrueで渡す）専用のスイッチ。
# 通常のpush/PR起点のパイプラインでは既定のfalseのまま。
parameters:
  run-weekly-security:
    type: boolean
    default: false

orbs:
  rust: circleci/rust@1.6.0

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.98.1
    # aws-sdk-ec2 のコンパイルは medium（4GB）では OOM で SIGKILL されるため large を使う
    resource_class: large

commands:
  cargo-with-lock:
    description: "Run a cargo subcommand with --locked (Cargo.lock is committed)"
    parameters:
      subcommand:
        type: string
    steps:
      - run:
          name: "cargo <<parameters.subcommand>> --locked"
          command: cargo <<parameters.subcommand>> --locked

jobs:
  fmt:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: "cargo fmt --check"
          command: cargo fmt --check

  clippy:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: "cargo clippy -- -D warnings"
          command: cargo clippy --all-targets --locked -- -D warnings
      - save_cache:
          key: cargo-registry-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target

  test:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - cargo-with-lock:
          subcommand: build
      # 実AWSアカウントに接触するテストは #[ignore] で分離済み。通常CI実行では実行しない
      # （team.mdの合意事項: CIでは実 AWS アカウントに接触するテストを自動実行しない）。
      - cargo-with-lock:
          subcommand: test

  coverage:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: "Install cargo-llvm-cov"
          command: |
            if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
              cargo install cargo-llvm-cov --locked
            fi
      - run:
          name: "cargo llvm-cov (行カバレッジ80%floor)"
          command: |
            cargo llvm-cov --lib --locked --fail-under-lines 80 --summary-only

  audit:
    executor: rust-executor
    steps:
      - checkout
      - run:
          name: "Install cargo-audit"
          command: |
            if ! command -v cargo-audit >/dev/null 2>&1; then
              cargo install cargo-audit --locked
            fi
      - run:
          name: "cargo audit (NFR2.6, 既知脆弱性があればブロック)"
          command: cargo audit

  deny:
    executor: rust-executor
    # `advisories`はRustSec脆弱性DBを見るため`audit`と同じ理由（DB更新に伴う非決定性・
    # 通常CIをブロックしたくない）で既定から外す。週次ワークフローでのみ`advisories`も含めて実行する。
    parameters:
      checks:
        type: string
        default: "bans licenses sources"
    steps:
      - checkout
      - run:
          name: "Install cargo-deny"
          command: |
            if ! command -v cargo-deny >/dev/null 2>&1; then
              cargo install cargo-deny --locked
            fi
      - run:
          name: "cargo deny check <<parameters.checks>> (NFR2.7)"
          command: cargo deny check <<parameters.checks>>

workflows:
  build-and-test:
    unless: << pipeline.parameters.run-weekly-security >>
    jobs:
      - fmt
      - clippy
      - test
      - coverage
      - deny

  # NFR2.6/2.7: 既知脆弱性チェック（cargo audit / cargo deny advisories）はRustSec DBの
  # 更新に依存し非決定的なため、通常のpush/PR CIをブロックせず週次で実行する。
  # トリガーはCircleCI Project Settings（またはAPI）のScheduled Pipelineで
  # `run-weekly-security: true` パラメータを渡して設定する（config.yml側の設定は不要）。
  weekly-security:
    when: << pipeline.parameters.run-weekly-security >>
    jobs:
      - audit
      - deny:
          name: deny-advisories
          checks: "advisories"

# タグ駆動リリース（v0.1.0 等のタグpushでクロスプラットフォームのリリースバイナリをビルドし
# GitHub Releases に添付する）は、このリポジトリのパイプライン定義には含まれていない。
# hideokamoto/circleci-configurations の workflows/release/rust-github-release.yaml を
# CircleCI の Config Sources 機能（複数パイプライン設定）で紐づけた、別のパイプライン定義
# （タグ push 起点）として実行する。設定手順は README.md の「リリース」節を参照。
