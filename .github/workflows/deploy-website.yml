# website/ (Astro Starlight) を GitHub Pages へデプロイする。
# 公式例: https://docs.astro.build/en/guides/deploy/github/
# カスタムドメインは website/public/CNAME（cwsweep.hidetaka.dev）で指定する。
# withastro/action@v6 は upload-pages-artifact に include-hidden-files: true を渡すため、
# .well-known/ もアップロードされる（https://github.com/withastro/action/blob/v6/action.yml）。
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      # /skill.md と /.well-known/agent-skills/ は skills/ をビルド時に読み込んで配信する。
      # skills/ だけを変えたときもサイトを再デプロイする。
      - "skills/**"
      - ".github/workflows/deploy-website.yml"
  # リリース履歴ページ（reference/releases）は GitHub Releases をビルド時に取得する。
  # リリースが公開されたら再デプロイして反映する。リリースは CircleCI 側のトークンで作られるため、
  # 「Actions の GITHUB_TOKEN が起こしたイベントではワークフローが動かない」制限には当たらない。
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        env:
          # Releases API を認証付きで呼ぶ（未認証の 60 リクエスト/時制限を避ける）。読み取りのみ。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
